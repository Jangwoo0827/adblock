<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ad Skipper</title>
  <style>
    :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --card:#f5f5f7; --accent:#34c759; --off:#c7c7cc; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1c1c1e; --fg:#f5f5f7; --muted:#98989d; --card:#2c2c2e; --off:#48484a; }
    }
    * { box-sizing: border-box; margin: 0; }
    body { width: 260px; padding: 16px; background: var(--bg); color: var(--fg);
           font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
    .row { display: flex; align-items: center; justify-content: space-between;
           background: var(--card); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .switch { position: relative; width: 42px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--off); border-radius: 24px;
              cursor: pointer; transition: background .2s; }
    .slider::before { content: ""; position: absolute; width: 20px; height: 20px; left: 2px; top: 2px;
                      background: #fff; border-radius: 50%; transition: transform .2s; }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider::before { transform: translateX(18px); }
    .count { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .label { color: var(--muted); font-size: 12px; }
    button { background: none; border: none; color: var(--muted); font-size: 12px;
             cursor: pointer; padding: 4px 0; }
    button:hover { color: var(--fg); text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Universal Ad Skipper &amp; Blocker</h1>

  <div class="row">
    <span id="status">Enabled</span>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <div>
      <div class="count" id="count">0</div>
      <div class="label">ads blocked / skipped</div>
    </div>
    <button id="reset">Reset</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
